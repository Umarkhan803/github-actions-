name: Two-Tier Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  FRONTEND_PATH: frontend
  BACKEND_PATH: backend

  IMAGE_NAME_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/gitaction_frontend
  IMAGE_NAME_BACKEND: ${{ secrets.DOCKER_USERNAME }}/gitaction_backend

jobs:

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build


  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test


  dependency-scan:
    needs:
      - frontend-build
      - backend-build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high


  docker-build:
    needs: dependency-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build \
            -t $IMAGE_NAME_FRONTEND:latest \
            -t $IMAGE_NAME_FRONTEND:${{ github.sha }} \
            ./frontend

      - name: Build Backend Image
        run: |
          docker build \
            -t $IMAGE_NAME_BACKEND:latest \
            -t $IMAGE_NAME_BACKEND:${{ github.sha }} \
            ./backend


  docker-push:
    needs: docker-build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t $IMAGE_NAME_FRONTEND:latest \
            -t $IMAGE_NAME_FRONTEND:${{ github.sha }} \
            ./frontend

      - name: Build Backend Image
        run: |
          docker build \
            -t $IMAGE_NAME_BACKEND:latest \
            -t $IMAGE_NAME_BACKEND:${{ github.sha }} \
            ./backend

      - name: Push Frontend Images
        run: |
          docker push $IMAGE_NAME_FRONTEND:latest
          docker push $IMAGE_NAME_FRONTEND:${{ github.sha }}

      - name: Push Backend Images
        run: |
          docker push $IMAGE_NAME_BACKEND:latest
          docker push $IMAGE_NAME_BACKEND:${{ github.sha }}

